services:
  conveyor:
    build:
      context: ./conveyor
    image: conveyor:1.0
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    restart: unless-stopped
    depends_on:
      - postgres
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - conveyor_network
    volumes:
      - conveyor-data:/app/data

  postgres:
    image: postgres:17
    profiles:
      - dev
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - conveyor-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - conveyor_network
networks:
  conveyor_network:

volumes:
  conveyor-postgres-data:
  conveyor-data: