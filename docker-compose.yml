services:
  conveyor:
    build:
      context: ./conveyor
    image: conveyor:1.0
    container_name: conveyor
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    restart: unless-stopped
    depends_on:
      - postgres
    mem_limit: 512m
    cpus: "1.0"

  postgres:
    image: postgres:17
    container_name: conveyor-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - conveyor-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

volumes:
  conveyor-postgres-data: